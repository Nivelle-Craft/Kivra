name: Build Kivra

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build
        run: gradle build --stacktrace

      - name: Prepare downloadable JAR
        if: success()
        shell: bash
        run: |
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)
          test -n "$JAR"
          cp "$JAR" Kivra-latest.jar

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kivra-${{ github.sha }}
          path: Kivra-latest.jar

      - name: Publish latest release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Kivra Latest
          body: |
            Latest successful Kivra build from the main branch.

            Commit: ${{ github.sha }}
          prerelease: true
          make_latest: true
          files: Kivra-latest.jar
